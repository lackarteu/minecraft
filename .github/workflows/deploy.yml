name: Deploy to Minecraft Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /home/minecraft/server
            git pull origin main
            mkdir -p plugins
            # Każdy plugin JAR musi mieć tu swoją linię wget — inaczej nie trafi na VPS.
            # Skript: wersja dopasowana do Paper (release notes). Przy upgrade MC zmień URL i nazwę pliku.
            [ -f plugins/Skript.jar ] || wget -O plugins/Skript.jar "https://github.com/SkriptLang/Skript/releases/download/2.15.2/Skript-2.15.2.jar"
            systemctl restart minecraft
