# Bossowie RPG — spawn: mm m spawn <wewnętrzna_nazwa> <świat> (lub spawner losowy)

StraznikLasu:
  Type: RAVAGER
  Display: '&2&lStrażnik Lasu'
  Health: 500
  Damage: 10
  Options:
    AlwaysShowName: true
    PreventOtherDrops: true
    KnockbackResistance: 0.8
    FollowRange: 40
    MovementSpeed: 0.28
  BossBar:
    Enabled: true
    Title: '&2Strażnik Lasu'
    Range: 64
    Color: GREEN
    Style: SEGMENTED_12
  Skills:
  - message{m="&8[&2&lBOSS&8] &aStrażnik Lasu &7obudził się w lesie!";audience=nearbyplayers} @self ~onSpawn
  - message{m="&8[&2&lBOSS&8] &aStrażnik Lasu &7 został pokonany!";audience=nearbyplayers} @self ~onDeath
  - skill{s=RPG_Straznik_Uderzenie_Ziemi} ~onTimer:140
  - skill{s=RPG_Straznik_Korzenie} ~onTimer:220
  - skill{s=RPG_Straznik_Wataha} ~onTimer:320
  Drops:
  - RPG_Miecz_Straznika_Lasu 1 1
  - exp 800 1

